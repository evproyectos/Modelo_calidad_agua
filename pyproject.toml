[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calidad-agua"
version = "0.2.0"
description = "Limpieza, variables y modelos de pronóstico y detección de eventos para sensores de calidad de agua"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "joblib",
    "pyyaml>=6",
]

[project.optional-dependencies]
# red neuronal LSTM (pronóstico de turbidez y pH)
red = ["tensorflow>=2.16"]
# para correr los notebooks de este proyecto
# (incluye MLflow, donde los notebooks 06, 07 y 08 registran los experimentos)
notebooks = ["matplotlib>=3.8", "seaborn>=0.13", "statsmodels>=0.14", "jupyter", "ipykernel", "mlflow>=3.5"]
# pruebas unitarias, cobertura y estilo (lo mismo que corre el CI)
dev = ["pytest>=8", "pytest-cov>=5", "flake8>=7", "mlflow>=3.5", "dill"]   # dill: prueba de persistencia.py

[tool.setuptools]
packages = ["calidad_agua"]

[tool.setuptools.package-data]
calidad_agua = ["hiperparametros.yaml"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]

# Cobertura de los módulos de preprocesamiento y variables (RNF-007: mínimo 70 %). Quedan fuera
# los que entrenan o grafican: red_neuronal (necesita TensorFlow), modelo y graficos.
[tool.coverage.run]
source = ["calidad_agua"]
omit = ["calidad_agua/red_neuronal.py", "calidad_agua/modelo.py", "calidad_agua/graficos.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
