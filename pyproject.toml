[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calidad-agua"
version = "0.1.0"
description = "Limpieza, variables y modelos de pronóstico y detección de eventos para sensores de calidad de agua"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "joblib",
]

[project.optional-dependencies]
# red neuronal LSTM (pronóstico de turbidez y pH)
red = ["tensorflow>=2.16"]
# para correr los notebooks de este proyecto
notebooks = ["matplotlib>=3.8", "seaborn>=0.13", "statsmodels>=0.14", "jupyter", "ipykernel"]

[tool.setuptools]
packages = ["calidad_agua"]
